name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Match native formatter line endings on checkout
        run: git config --global core.autocrlf ${{ runner.os == 'Windows' && 'true' || 'input' }}
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - run: vp run check-all
      - run: vp test
      - run: vp run build
      - name: Install browser for UI checks
        if: runner.os == 'Linux'
        run: vpx playwright install --with-deps chromium
      - name: Check component interactions
        if: runner.os == 'Linux'
        run: vpx playwright test
